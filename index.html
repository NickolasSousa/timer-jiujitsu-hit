<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
  <title>Interval Timer</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body data-phase="idle" data-status="idle">
  <main class="layout">
    <section class="timer" aria-label="Cronômetro">
      <p class="phase-label" id="phase-label" aria-live="polite">Pronto</p>
      <div class="time" id="time" role="timer">05:00</div>
      <p class="cycle" id="cycle">6 ciclos</p>

      <div class="progress" role="progressbar" aria-label="Progresso do treino" aria-valuemin="0" aria-valuemax="100" id="progress">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <p class="total" id="total">Total 35:00</p>
      <p class="hint" id="audio-hint" role="status" hidden>O navegador pausou o som. Toque na tela para tentar reativar.</p>

      <div class="controls">
        <button type="button" class="btn btn-primary" id="btn-toggle">Iniciar</button>
        <button type="button" class="btn" id="btn-restart" disabled>Reiniciar</button>
        <button type="button" class="btn" id="btn-stop" disabled>Encerrar</button>
      </div>
    </section>

    <aside class="sidebar">
      <section class="panel" aria-labelledby="config-title">
        <h2 id="config-title">Configuração</h2>
        <form id="config-form" novalidate>
          <fieldset id="config-fieldset" class="fields"></fieldset>
        </form>
        <p class="hint" id="config-feedback" aria-live="polite"></p>
        <p class="hint" id="config-lock-hint" hidden>Encerre o treino para alterar a configuração.</p>
      </section>

      <section class="panel" aria-labelledby="presets-title">
        <div class="panel-header">
          <h2 id="presets-title">Predefinições</h2>
          <button type="button" class="btn btn-small" id="btn-new-preset">Nova</button>
        </div>
        <ul class="preset-list" id="preset-list"></ul>
        <p class="hint" id="preset-empty" hidden>Nenhuma predefinição salva.</p>
      </section>
    </aside>
  </main>

  <dialog id="preset-dialog" aria-labelledby="preset-dialog-title">
    <form id="preset-form" method="dialog" novalidate>
      <h2 id="preset-dialog-title">Nova predefinição</h2>
      <label class="field">
        <span class="field-label">Nome</span>
        <input type="text" name="name" maxlength="40" required autocomplete="off" placeholder="Ex.: Jiu-Jitsu">
      </label>
      <div class="fields" id="preset-fields"></div>
      <p class="hint" id="preset-feedback" aria-live="polite"></p>
      <div class="dialog-actions">
        <button type="button" class="btn" id="btn-cancel-preset">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  </dialog>

  <!-- Shared by the main config form and the preset dialog. -->
  <template id="timer-fields-template">
    <div class="field" role="group" aria-label="Tempo de atividade">
      <span class="field-label">Atividade</span>
      <div class="duration">
        <label><input type="number" name="workMin" min="0" max="99" inputmode="numeric" aria-label="Atividade, minutos"><span>min</span></label>
        <label><input type="number" name="workSec" min="0" max="59" inputmode="numeric" aria-label="Atividade, segundos"><span>s</span></label>
      </div>
    </div>
    <div class="field" role="group" aria-label="Tempo de descanso">
      <span class="field-label">Descanso</span>
      <div class="duration">
        <label><input type="number" name="restMin" min="0" max="99" inputmode="numeric" aria-label="Descanso, minutos"><span>min</span></label>
        <label><input type="number" name="restSec" min="0" max="59" inputmode="numeric" aria-label="Descanso, segundos"><span>s</span></label>
      </div>
    </div>
    <label class="field">
      <span class="field-label">Ciclos</span>
      <input type="number" name="cycles" min="1" max="99" inputmode="numeric">
    </label>
  </template>
</body>
</html>
